name: ROS 2 Lyrical CI

on:
  pull_request:
    branches:
      - lyrical
      - rolling
  push:
    branches:
      - lyrical
      - rolling
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    container:
      image: rostooling/setup-ros-docker:ubuntu-resolute-ros-lyrical-ros-base-latest

    steps:
      - name: Build and test ROS packages
        uses: ros-tooling/action-ros-ci@v0.4
        with:
          package-name: |
            shmem_buffer_backend_msgs
            shared_buffer
            shmem_buffer_backend_py
            shmem_buffer_backend
          target-ros2-distro: lyrical
          no-symlink-install: true
          extra-cmake-args: -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          coverage-result: false
